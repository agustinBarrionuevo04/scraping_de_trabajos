search_terms:
  - "data scientist"
  - "machine learning engineer"
  - "ml engineer"
  - "data science"
  - "junior data scientist"
  - "data scientist trainee"
  - "pasantia data scientist"
  - "pasantia IT"
  - "backend developer"
  - "backend"
locations:
  - "Remote"
  - "Argentina"
  - "Córdoba, Argentina"
  - "Spain"
  - "Mexico"
  - "Chile"
results_per_search: 50
# delay between requests in seconds (for jobspy rate-limiting)
delay_seconds: 4
# Filter jobs by seniority role found in the listing title.
# Options: jr, sr, ssr, mid, trainee, sin-prefijo, todos
# Leave empty to keep everything. "sin-prefijo" keeps generic roles with no seniority hint.
roles:
  - "jr"
  - "sr"
  - "ssr"
  - "mid"
  - "trainee"
  - "sin-prefijo"
# path to candidate profile text file for semantic scoring
profile_path: "profile.txt"
